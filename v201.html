<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#faf9f6">
<title>VOCABULARY 201 · 챕터별 어휘 학습</title>
<style>
:root{
  --bg:#faf9f6; --card:#ffffff; --ink:#1f2430; --sub:#6b7280; --line:#e7e5df;
  --accent:#2563eb; --accent-soft:#eff4ff; --green:#0f6e56; --green-soft:#e8f5ef;
  --red:#991b1b; --red-soft:#fdecec; --chip:#eef0f4; --shadow:0 1px 2px rgba(20,20,40,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  -webkit-text-size-adjust:100%;}
.wrap{max-width:1180px;margin:0 auto;padding:18px 14px 60px;}
header{text-align:center;padding:14px 0 6px;}
header h1{margin:0;font-size:25px;font-weight:700;letter-spacing:-.3px;}
header .sub{color:var(--sub);font-size:14px;margin-top:6px;}
header .note{color:#9aa1ab;font-size:12px;margin-top:6px;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px;margin:16px 0;}
.tab{padding:13px 6px;border-radius:11px;border:1px solid transparent;background:transparent;
  font-size:15px;font-weight:600;color:var(--sub);cursor:pointer;text-align:center;transition:.12s;}
.tab:hover{background:#f4f3ef;}
.tab.active{background:var(--accent-soft);border-color:#cfe0ff;color:var(--accent);}
.tab .cnt{color:var(--red);font-weight:700;}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;padding:12px;margin-bottom:14px;}
@media(max-width:680px){
  .grid{grid-template-columns:repeat(6,1fr);gap:7px;}
  .tab{font-size:14px;padding:12px 2px;}
  .tab .cnt{font-size:13px;}
  header h1{font-size:22px;}
  .daybtn{font-size:14px;padding:10px 2px 8px;min-height:48px;}
  .daybtn .pct{font-size:9.5px;}
}
@media(max-width:360px){
  .grid{grid-template-columns:repeat(5,1fr);}
  .tab{font-size:13px;padding:11px 1px;}
}
.daybtn{position:relative;border:1px solid var(--line);background:#fff;border-radius:11px;
  padding:11px 4px 9px;text-align:center;cursor:pointer;font-size:15px;font-weight:600;transition:.12s;min-height:50px;}
.daybtn:hover{background:#f7f6f2;}
.daybtn.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);color:var(--accent);}
.daybtn.done{border-color:var(--green);}
.daybtn .pct{display:block;font-size:10px;color:var(--green);font-weight:700;margin-top:2px;height:11px;}
.daybtn .dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--red);}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 14px;margin-bottom:12px;font-size:13.5px;color:var(--sub);}
.bar .spacer{flex:1;}
.toggle-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-size:14px;
  font-weight:600;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.toggle-btn.on{background:var(--accent-soft);border-color:#cfe0ff;color:var(--accent);}
.chk{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;font-weight:600;color:var(--ink);}
.chk input{width:17px;height:17px;accent-color:var(--accent);}
.hint{font-size:12.5px;color:#9aa1ab;}

/* word list */
.list{display:flex;flex-direction:column;gap:10px;padding:6px 0;}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px;
  box-shadow:var(--shadow);position:relative;cursor:pointer;transition:.1s;overflow:hidden;}
.wcard:hover{border-color:#d7d4cc;}
.wcard.mem{background:var(--green-soft);border-color:#bfe3d3;}
.wcard.unk{border-left:5px solid var(--red);background:var(--red-soft);}
.wcard .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.wcard .no{color:#aab0ba;font-size:13px;font-weight:700;min-width:24px;}
.wcard .word{font-size:19px;font-weight:500;letter-spacing:-.2px;}
.wcard .ipa{color:var(--accent);font-size:14px;}
.wcard .pos{background:var(--chip);color:#5b6573;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;}
.spk{border:none;background:#eef2f7;color:#42505f;border-radius:8px;width:30px;height:26px;cursor:pointer;font-size:13px;line-height:1;}
.spk:hover{background:#e2e8f0;}
.wcard .state{margin-left:auto;font-size:13px;font-weight:700;}
.wcard.mem .state{color:var(--green);}
.wcard.unk .state{color:var(--red);}
.meaning{margin-top:9px;padding-left:34px;font-size:15px;line-height:1.6;color:#2b313c;white-space:pre-line;}
.meaning .ln{display:block;}
.meaning.hidden{filter:none;}
.reveal-ph{margin-top:9px;margin-left:34px;display:inline-flex;align-items:center;gap:6px;
  color:#9aa1ab;font-size:13.5px;background:#f4f3ef;border:1px dashed #d9d6cd;border-radius:9px;padding:7px 13px;cursor:pointer;}
.reveal-ph:hover{background:#eeece6;}

/* flashcard */
.flash-wrap{padding:14px 6px 8px;display:flex;flex-direction:column;align-items:center;}
.flash{width:100%;max-width:560px;min-height:clamp(360px,58vh,640px);background:var(--card);border:1px solid var(--line);
  border-radius:18px;box-shadow:var(--shadow);padding:30px 22px;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;position:relative;
  touch-action:pan-y;user-select:none;-webkit-user-select:none;}
.flash.unk{border-left:6px solid var(--red);}
.flash .fday{color:#aab0ba;font-size:14px;font-weight:600;}
.flash .fword{font-size:clamp(44px,14vw,72px);font-weight:500;letter-spacing:-1.2px;line-height:1.04;word-break:break-word;}
.flash .fword-back{font-size:clamp(26px,7vw,36px);letter-spacing:-.5px;}
.flash .fipa{color:var(--accent);font-size:clamp(17px,5vw,21px);}
.flash .fpos{background:var(--chip);color:#5b6573;font-size:13px;font-weight:700;padding:4px 13px;border-radius:999px;}
.flash .fdef{font-size:clamp(16px,4.4vw,18px);line-height:1.7;color:#2b313c;white-space:pre-line;text-align:left;width:100%;margin-top:4px;}
.flash .flip-hint{color:#aab0ba;font-size:13px;margin-top:6px;}
.flash .fspk{position:absolute;top:14px;right:14px;width:40px;height:36px;font-size:16px;border-radius:10px;}
.flash-nav{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center;}
.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 18px;font-size:15px;
  font-weight:700;color:var(--ink);cursor:pointer;}
.btn:hover{background:#f4f3ef;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{background:#1d51c9;}
.btn.green{background:var(--green);border-color:var(--green);color:#fff;}
.btn.red{background:#fff;border-color:#e6b8b8;color:var(--red);}
.btn.red.on{background:var(--red);color:#fff;}
.btn:disabled{opacity:.4;cursor:default;}
.counter{color:var(--sub);font-size:14px;font-weight:700;min-width:74px;text-align:center;}

/* quiz */
.quiz-wrap{padding:14px 8px;max-width:620px;margin:0 auto;}
.quiz-q{text-align:center;margin-bottom:6px;}
.quiz-q .qword{font-size:32px;font-weight:800;}
.quiz-q .qipa{color:var(--accent);font-size:16px;margin-top:4px;}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
.opt{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;font-size:15.5px;
  cursor:pointer;text-align:left;line-height:1.5;}
.opt:hover{background:#f6f5f1;}
.opt.correct{background:var(--green-soft);border-color:#bfe3d3;color:#0c5944;font-weight:700;}
.opt.wrong{background:var(--red-soft);border-color:#e6b8b8;color:var(--red);}
.opt:disabled{cursor:default;}
.quiz-foot{display:flex;align-items:center;gap:12px;margin-top:18px;justify-content:space-between;flex-wrap:wrap;}
.scoreline{font-weight:700;color:var(--sub);}

/* unknown */
.unk-controls{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;align-items:center;}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.seg button{border:none;background:#fff;padding:9px 15px;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer;}
.seg button.on{background:var(--accent-soft);color:var(--accent);}
.empty{text-align:center;color:#9aa1ab;padding:46px 10px;font-size:15px;line-height:1.7;}

footer{margin-top:18px;}
.summary{display:flex;flex-wrap:wrap;gap:18px;align-items:center;padding:14px 16px;font-size:14px;color:var(--sub);}
.summary b{color:var(--ink);}
.summary .reset{margin-left:auto;border:1px solid #e6b8b8;color:var(--red);background:#fff;border-radius:10px;
  padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;}
.progress-track{height:7px;background:#eceae4;border-radius:99px;overflow:hidden;flex:1;min-width:120px;max-width:260px;}
.progress-fill{height:100%;background:var(--green);width:0;}
.hide{display:none!important;}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);background:#1f2430;color:#fff;
  padding:11px 16px;border-radius:10px;font-size:13px;line-height:1.5;max-width:88%;text-align:center;opacity:0;
  pointer-events:none;transition:opacity .25s,transform .25s;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,.28);}
#toast.show{opacity:.97;transform:translateX(-50%) translateY(0);}
</style>
</head>

  </header>

  <div class="panel tabs" id="tabs"></div>
  <div class="panel grid" id="grid"></div>

    <div class="panel summary" id="summary"></div>
  </footer>
</div>

const NDAYS = DATA.length;

/* ---------- storage ---------- */
const LS_MEM='v201ch_mem', LS_UNK='v201ch_unk', LS_ST='v201ch_state';
function loadSet(k){try{return new Set(JSON.parse(localStorage.getItem(k)||'[]'));}catch(e){return new Set();}}
function saveSet(k,s){try{localStorage.setItem(k,JSON.stringify([...s]));}catch(e){}}
let MEM=loadSet(LS_MEM), UNK=loadSet(LS_UNK);
function saveAll(){saveSet(LS_MEM,MEM);saveSet(LS_UNK,UNK);localStorage.setItem(LS_ST,JSON.stringify({day:state.day,view:state.view}));}
const key=(d,i)=>d+':'+i;
const isMem=(d,i)=>MEM.has(key(d,i));
const isUnk=(d,i)=>UNK.has(key(d,i));
function setMem(d,i,v){const k=key(d,i); if(v){MEM.add(k);} else {MEM.delete(k);} saveAll();}
function setUnk(d,i,v){const k=key(d,i); if(v){UNK.add(k);} else {UNK.delete(k);} saveAll();}

/* ---------- state ---------- */
let st0={}; try{st0=JSON.parse(localStorage.getItem(LS_ST)||'{}');}catch(e){}
const state={
  view: (st0.view && st0.view!=='quiz') ? st0.view : 'list',
  day: st0.day || 1,
  shuffle:false,
  hideMeaning:false,
  unkHideMeaning:true,        // 모름 목록은 기본적으로 뜻 가림
  activeList:'day',           // 'day'(단어장) | 'unk'(모름 목록): 카드 숨김 플래그 선택
  revealed:new Set(),         // keys revealed individually in hide mode
  order:null,                 // shuffled order for list/flash/quiz
  flashIdx:0, flashFlip:false,
  quizIdx:0, quizScore:0, quizAnswered:false, quizPicks:[],
  src:'day',                  // 'day' | 'unk' : context for flash/quiz
  unkScope:'day',             // 'day' | 'all'
  unkSub:'list',              // list | flash | quiz
};

/* ---------- helpers ---------- */
function shuffleArr(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function dayRefs(d){return DATA[d-1].map((_,i)=>({d,i}));}
function dayStats(d){let m=0,u=0;DATA[d-1].forEach((_,i)=>{if(isMem(d,i))m++;if(isUnk(d,i))u++;});return{m,u,pct:Math.round(m/DATA[d-1].length*100)};}
function totalStats(){let m=0,u=0,t=0;for(let d=1;d<=NDAYS;d++){t+=DATA[d-1].length;DATA[d-1].forEach((_,i)=>{if(isMem(d,i))m++;if(isUnk(d,i))u++;});}return{m,u,t,pct:Math.round(m/t*100)};}
function unknownRefs(scope){const out=[];const days=scope==='day'?[state.day]:Array.from({length:NDAYS},(_,k)=>k+1);
  for(const d of days){DATA[d-1].forEach((_,i)=>{if(isUnk(d,i))out.push({d,i});});}return out;}
let synthVoice=null, voicesLoaded=false, _voiceCheckReady=false, _noVoiceToasted=false;
function loadVoices(){if(!('speechSynthesis'in window))return;const vs=speechSynthesis.getVoices()||[];if(vs.length){voicesLoaded=true;synthVoice=vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}}
if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;setTimeout(loadVoices,300);setTimeout(()=>{loadVoices();_voiceCheckReady=true;},1300);}
// 첫 사용자 입력에서 음성 엔진 예열(태블릿/사파리 첫 재생 무음 방지)
let _warmed=false;
function warmupTTS(){if(_warmed||!('speechSynthesis'in window))return;_warmed=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}}
document.addEventListener('pointerdown',warmupTTS,{once:true});
let _toastT=null;
function toast(msg){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el);}el.textContent=msg;el.classList.add('show');clearTimeout(_toastT);_toastT=setTimeout(()=>el.classList.remove('show'),4000);}
function speak(text,ev){
  if(ev){ev.stopPropagation();}
  if(!('speechSynthesis'in window)){toast('이 브라우저는 음성 듣기를 지원하지 않습니다.');return;}
  try{
    if(!voicesLoaded)loadVoices();
    speechSynthesis.cancel();
    try{speechSynthesis.resume();}catch(e){}   // 크롬 데스크톱 '멈춤(paused)' 상태 해제
    const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.9;if(synthVoice)u.voice=synthVoice;
    speechSynthesis.speak(u);
    setTimeout(()=>{try{if(speechSynthesis.paused)speechSynthesis.resume();}catch(e){}},120);  // pending 멈춤 재가동
    if(_voiceCheckReady && !voicesLoaded && (speechSynthesis.getVoices()||[]).length===0 && !_noVoiceToasted){
      _noVoiceToasted=true;toast('이 기기에 영어 음성(TTS)이 없는 것 같아요. 기기의 음성/TTS 설정에서 영어 음성을 설치하면 들을 수 있습니다.');
    }
  }catch(e){toast('발음 재생에 실패했습니다. 잠시 후 다시 시도해 주세요.');}
}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ---------- render root ---------- */
const $tabs=document.getElementById('tabs'),$grid=document.getElementById('grid'),
      $content=document.getElementById('content'),$summary=document.getElementById('summary');

function render(){renderTabs();renderGrid();renderContent();renderSummary();saveAll();}

function renderTabs(){
  const u=totalStats().u;
  const tabs=[['list','단어장'],['flash','플래시카드'],['unknown','모름']];
  $tabs.innerHTML=tabs.map(([k,label])=>{
    const cnt=(k==='unknown')?` <span class="cnt">(${u})</span>`:'';
    return `<button class="tab ${state.view===k?'active':''}" data-view="${k}">${label}${cnt}</button>`;
  }).join('');
  $tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{switchView(b.dataset.view);});
}
function switchView(v){
  state.view=v; state.flashIdx=0;state.flashFlip=false;state.quizIdx=0;state.quizScore=0;state.quizAnswered=false;
  state.order=null; state.revealed.clear();
  if(v==='flash'||v==='quiz'){state.src='day';}
  render();
}

function renderGrid(){
  let h='';
  for(let d=1;d<=NDAYS;d++){
    const s=dayStats(d);
    const cls=['daybtn'];if(d===state.day&&(state.view==='list'||state.view==='flash'||state.view==='quiz'||state.view==='unknown'))cls.push('sel');
    if(s.pct===100)cls.push('done');
    h+=`<button class="${cls.join(' ')}" data-day="${d}">${d}<span class="pct">${s.pct>0&&s.pct<100?s.pct+'%':''}</span>${s.u>0?'<span class="dot"></span>':''}</button>`;
  }
  $grid.innerHTML=h;
  $grid.querySelectorAll('.daybtn').forEach(b=>b.onclick=()=>{
    state.day=+b.dataset.day; state.flashIdx=0;state.flashFlip=false;state.quizIdx=0;state.quizScore=0;state.quizAnswered=false;
    state.order=null;state.revealed.clear(); render();
  });
}

function renderContent(){
  if(state.view==='flash')return renderFlash(dayRefs(state.day),'day');
  if(state.view==='unknown')return renderUnknown();
  return renderList();
}

/* ---------- LIST (단어장) with hide/show ---------- */
function getListOrder(){
  if(!state.order){let refs=dayRefs(state.day);state.order=state.shuffle?shuffleArr(refs):refs;}
  else if(state.order.length!==DATA[state.day-1].length){state.order=dayRefs(state.day);}
  return state.order;
}
function renderList(){
  state.activeList='day';
  const refs=getListOrder();
  const hideBtn=`<button class="toggle-btn ${state.hideMeaning?'on':''}" id="hideToggle">${state.hideMeaning?'👁 뜻 전체 보기':'🙈 뜻 전체 숨기기'}</button>`;
  const bar=`<div class="panel bar">
      ${hideBtn}
      <label class="chk"><input type="checkbox" id="shuf" ${state.shuffle?'checked':''}> 순서 섞기</label>
      <span class="spacer"></span>
      <span class="hint">탭: 암기 완료 · 길게 눌러 모름 · 뜻 영역 탭: 가린 뜻 보기 · 🔊 발음</span>
    </div>`;
  let cards='';
  refs.forEach((r,pos)=>{cards+=wordCardHTML(r.d,r.i,pos+1);});
  $content.innerHTML=bar+`<div class="list" id="list">${cards}</div>`;
  document.getElementById('hideToggle').onclick=()=>{state.hideMeaning=!state.hideMeaning;state.revealed.clear();renderList();};
  document.getElementById('shuf').onchange=e=>{state.shuffle=e.target.checked;state.order=null;renderList();};
  bindCardEvents();
}
function wordCardHTML(d,i,no){
  const w=DATA[d-1][i];
  const cls=['wcard'];if(isMem(d,i))cls.push('mem');if(isUnk(d,i))cls.push('unk');
  const stateTag=isUnk(d,i)?'<span class="state">✗ 모름</span>':(isMem(d,i)?'<span class="state">✓ 완료</span>':'');
  const ipa=w.ipa?`<span class="ipa">${escapeHtml(w.ipa)}</span>`:'';
  const pos=w.pos?`<span class="pos">${w.pos}</span>`:'';
  const defLines=w.def.map(l=>`<span class="ln">${escapeHtml(l)}</span>`).join('');
  const k=key(d,i);
  const revealed=state.revealed.has(k);
  const hideM = (state.activeList==='unk') ? state.unkHideMeaning : state.hideMeaning;
  let meaningBlock;
  if(hideM && !revealed){
    meaningBlock=`<div class="reveal-ph" data-reveal="${k}">👁 뜻 보기</div>`;
  }else{
    meaningBlock=`<div class="meaning">${defLines}</div>`;
  }

    <div class="row1">
      <span class="no">${String(no).padStart(2,'0')}</span>

      ${ipa}${pos}${stateTag}
    </div>

}
function bindCardEvents(){
  $content.querySelectorAll('.spk').forEach(b=>b.onclick=e=>speak(b.dataset.speak,e));
  $content.querySelectorAll('.reveal-ph').forEach(el=>el.onclick=e=>{
    e.stopPropagation();state.revealed.add(el.dataset.reveal);
    // re-render just this card
    const card=el.closest('.wcard');const d=+card.dataset.d,i=+card.dataset.i;
    const no=card.querySelector('.no').textContent;
    card.outerHTML=wordCardHTML(d,i,+no);
    bindCardEvents();
  });
  $content.querySelectorAll('.wcard').forEach(card=>{
    const d=+card.dataset.d,i=+card.dataset.i;
    let timer=null,longFired=false,moved=false,sx=0,sy=0;
    const start=(x,y)=>{longFired=false;moved=false;sx=x;sy=y;timer=setTimeout(()=>{longFired=true;
      setUnk(d,i,!isUnk(d,i)); if(isUnk(d,i))setMem(d,i,false); refreshCard(card,d,i);renderTabs();renderGrid();renderSummary();},500);};
    const move=(x,y)=>{if(Math.abs(x-sx)>10||Math.abs(y-sy)>10){moved=true;clearTimeout(timer);}};
    const end=(e)=>{clearTimeout(timer);
      if(longFired){e.preventDefault&&e.preventDefault();return;}
      if(moved)return;
      // if tapped a reveal placeholder or speaker, ignore (handled separately)
      if(e.target.closest('.reveal-ph')||e.target.closest('.spk'))return;
      // tap toggles memorized
      setMem(d,i,!isMem(d,i)); if(isMem(d,i))setUnk(d,i,false); refreshCard(card,d,i);renderTabs();renderGrid();renderSummary();};
    card.addEventListener('pointerdown',e=>{if(e.target.closest('.spk'))return;start(e.clientX,e.clientY);});
    card.addEventListener('pointermove',e=>move(e.clientX,e.clientY));
    card.addEventListener('pointerup',end);
    card.addEventListener('pointercancel',()=>clearTimeout(timer));
    card.addEventListener('pointerleave',()=>clearTimeout(timer));
  });
}
function refreshCard(card,d,i){
  const no=card.querySelector('.no').textContent;
  card.outerHTML=wordCardHTML(d,i,+no);
  bindCardEvents();
}

/* ---------- FLASHCARD ---------- */
function attachFlashGestures(card, doPrev, doNext, doFlip){
  let sx=0, sy=0, active=false;
  card.addEventListener('pointerdown', e=>{
    if(e.target.closest('.spk')){active=false;return;}
    active=true; sx=e.clientX; sy=e.clientY;
  });
  card.addEventListener('pointerup', e=>{
    if(!active)return; active=false;
    if(e.target.closest('.spk'))return;
    const dx=e.clientX-sx, dy=e.clientY-sy, adx=Math.abs(dx), ady=Math.abs(dy);
    if(adx>=50 && adx>ady){ if(dx<0) doNext(); else doPrev(); }   // 가로 스와이프
    else if(adx<10 && ady<10){ doFlip(); }                        // 탭
    // 그 외(세로 스크롤/드래그): 무시
  });
  card.addEventListener('pointercancel', ()=>{active=false;});
}
// 긴 단어가 카드 너비를 넘으면 그 단어만 한 줄에 맞게 폰트를 자동 축소
function fitWord(el){
  if(!el)return;
  el.style.whiteSpace='nowrap';
  el.style.display='inline-block';
  el.style.fontSize='';                 // CSS clamp 기본값으로 리셋
  const p=el.parentElement; if(!p)return;
  const cs=getComputedStyle(p);
  const pad=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
  const avail=p.clientWidth-pad-6;
  const natural=el.scrollWidth||el.offsetWidth;
  if(avail>0 && natural>avail){
    const maxPx=parseFloat(getComputedStyle(el).fontSize)||48;
    let size=Math.floor(maxPx*avail/natural);
    const minPx=22;
    if(size<minPx){size=minPx;el.style.whiteSpace='normal';}  // 너무 길면 최소크기+줄바꿈
    el.style.fontSize=size+'px';
  }
}
// 표시 단어가 바뀌면 항상 앞면(단어)부터 보이도록 보장. 같은 단어에서 탭으로 뒤집을 때만 뒷면 유지.
let _lastFlashKey=null;

}

  document.getElementById('mkmem').onclick=()=>{setMem(r.d,r.i,true);setUnk(r.d,r.i,false);renderTabs();renderGrid();renderSummary();

/* ---------- QUIZ ---------- */
function buildQuizOrder(refs){return state.shuffle?shuffleArr(refs):refs;}
function renderQuiz(refs,src){
  if(!state.quizRefs||state.quizSrc!==src||state.quizRefs.length!==refs.length){
    state.quizRefs=buildQuizOrder(refs);state.quizSrc=src;state.quizIdx=0;state.quizScore=0;state.quizAnswered=false;

    $content.innerHTML=`<div class="panel"><div class="empty">

    return;
  }
  const r=refs[state.quizIdx];const w=DATA[r.d-1][r.i];
  if(!state.quizPicks||!state.quizPicks.length||state.quizAnswered===false&&state.quizCurrent!==state.quizIdx){
    // build options once per question
    const correct=w.short||w.def[0]||'';
    const pool=[];for(let dd=1;dd<=NDAYS;dd++){DATA[dd-1].forEach((x,xi)=>{if(!(dd===r.d&&xi===r.i))pool.push(x.short||x.def[0]||'');});}
    const distract=shuffleArr(pool).filter(s=>s&&s!==correct).slice(0,3);
    state.quizPicks=shuffleArr([correct,...distract]);state.quizCorrect=correct;state.quizCurrent=state.quizIdx;state.quizAnswered=false;state.quizChosen=null;
  }
  const ipa=w.ipa?`<div class="qipa">${escapeHtml(w.ipa)} <button class="spk" data-speak="${escapeHtml(w.w)}">🔊</button></div>`:`<div class="qipa"><button class="spk" data-speak="${escapeHtml(w.w)}">🔊</button></div>`;
  let opts='';
  state.quizPicks.forEach((o,oi)=>{
    let c='opt';
    if(state.quizAnswered){if(o===state.quizCorrect)c+=' correct';else if(o===state.quizChosen)c+=' wrong';}
    opts+=`<button class="${c}" data-opt="${oi}" ${state.quizAnswered?'disabled':''}>${escapeHtml(o)}</button>`;
  });
  const nextBtn=state.quizAnswered?`<button class="btn primary" id="qnext">${state.quizIdx===refs.length-1?'결과 보기':'다음 ▶'}</button>`:'';
  $content.innerHTML=`<div class="panel quiz-wrap">
    <div class="scoreline" style="text-align:center">${state.quizIdx+1} / ${refs.length} · 점수 ${state.quizScore}</div>
    <div class="quiz-q"><div class="qword">${escapeHtml(w.w)}</div>${ipa}</div>
    <div class="opts">${opts}</div>
    <div class="quiz-foot"><span class="scoreline">${state.quizAnswered?(state.quizChosen===state.quizCorrect?'✓ 정답':'✗ 오답 — 모름에 추가됨'):'뜻을 고르세요'}</span>${nextBtn}</div>
  </div>`;
  $content.querySelectorAll('.spk').forEach(b=>b.onclick=e=>speak(b.dataset.speak,e));
  if(!state.quizAnswered){
    $content.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const chosen=state.quizPicks[+b.dataset.opt];state.quizChosen=chosen;state.quizAnswered=true;
      if(chosen===state.quizCorrect){state.quizScore++;}

      renderQuiz(refs,src);

  }
}

    <div class="progress-track"><div class="progress-fill" style="width:${d.pct}%"></div></div>
    <span>전체: <b>${t.m}/${t.t}</b> (${t.pct}%) · 모름 <b>${t.u}</b></span>
    <button class="reset" id="resetBtn">진도 초기화</button>`;
  document.getElementById('resetBtn').onclick=()=>{
    if(confirm('모든 암기 진도와 모름 표시를 삭제할까요? 되돌릴 수 없습니다.')){
      MEM.clear();UNK.clear();saveAll();render();}
  };
}

render();
window.addEventListener('resize',()=>{const fw=document.querySelector('#flashCard .fword');if(fw)fitWord(fw);});
</script>
</body>
</html>
